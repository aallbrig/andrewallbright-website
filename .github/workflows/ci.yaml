---
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2.10.3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install tooling
        run: |
          pip install pre-commit -r requirements-dev.txt
          sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          scripts/install_tools.sh actionlint
          composer install --no-interaction --prefer-dist
          npm ci
      - name: Run quality gates
        run: task ci

  wp-tests:
    name: WordPress tests in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2.10.3
          coverage: none
      - name: Install tooling
        run: |
          sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          composer install --no-interaction --prefer-dist
          scripts/dev_env.sh
      - name: Run task test:wp
        run: task test:wp
